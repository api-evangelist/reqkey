description: >-
  ReqKey's operational lifecycle posture, recorded including its absences. There
  is no API versioning scheme, no deprecation policy, no public changelog, no
  public status page and no public uptime SLA — an SLA exists only inside an
  Enterprise agreement. What ReqKey does publish well is the RESOURCE lifecycle
  (states, soft-delete windows, restore semantics) and the root-key rotation
  path, both captured below.
