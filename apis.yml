name: ReqKey
description: >-
  ReqKey is out-of-band API key authentication, usage credits, rate limiting and request analytics as a
  service for teams that sell or expose an API. It never sits in front of customer traffic: your own
  middleware makes one call to POST /key/validate per request, which checks the key, deducts a credit from
  that customer's pool and records the decision, typically in under 5ms over a reused connection. The
  defining design choice is that credits and rate limits live on the CONSUMER rather than the key, so
  issuing a customer fifty keys never multiplies their plan into fifty quotas and disabling a consumer
  stops all of its keys at once. Validation is Redis-backed and runs in multiple AWS regions with a global
  sync layer reconciling credit balances. A second endpoint, POST /ingest, correlates full request/response
  logs to a validation by requestId and feeds an Analytics API over two datasets. Seven first-party SDKs
  wrap both calls as framework middleware.
