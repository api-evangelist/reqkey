tools:
- name: validate_key
  description: Validate a consumer API key, enforce scope and rate limit, and deduct credits.
  source_operation: POST /key/validate
  docs: https://www.reqkey.com/docs/api/keys
  body_fields:
  - key
  - apiId
  - credits
  - resource
  consequence: write
  note: 'Not read-only — a successful call deducts from the consumer''s credit pool and is not idempotent.
    An agent should pass `credits: 0` for inspection.'
