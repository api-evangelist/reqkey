source: 'Derived from the 32 endpoints published in the ReqKey API reference (https://www.reqkey.com/docs/api/*)
  and llms.txt. ReqKey operates NO MCP server: mcp.reqkey.com does not resolve, /.well-known/mcp.json
  returned 404 on every host, no @modelcontextprotocol package or registry listing exists, and the docs
  never mention MCP as a ReqKey surface (their blog discusses MCP rate-limiting as a topic, not a product).'
description: 'A CANDIDATE tool surface — what an official ReqKey MCP server would expose if ReqKey shipped
  one. This is an API Evangelist proposal grounded in real, documented endpoints, NOT a server that exists.
  Because no server exists, there is deliberately no `type: MCPServer` pointer in apis.yml; wiring one
  would credit ReqKey with an agent surface it does not operate. Tool input schemas are intentionally
  omitted: ReqKey publishes no OpenAPI, so there is no machine-readable parameter contract to inherit
  and inventing one would be fabrication. Body fields are named from the docs and linked back to them.'
server:
  name: reqkey
  transport: http
  url: null
  auth: HTTP Bearer — the project root key (reqkey_...)
  note: A root key is full-access over its project, so an MCP server fronting it would hand an agent delete
    rights over every consumer and key. A restricted or read-only credential is a prerequisite ReqKey
    does not currently offer.
